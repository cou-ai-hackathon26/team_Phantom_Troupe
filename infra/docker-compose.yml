# Default: only the API runs locally; Postgres = Supabase, vectors = Qdrant Cloud (URLs in ../.env).
# Offline profile: local Qdrant and Postgres. Unrehearsed; follow README.md -> "Demo day".
# Do not run ingest_jsonl.py unless QDRANT_URL is localhost: it overwrites the index it points at.
services:
  api:
    build: ../backend
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data

  postgres:
    profiles: ["offline"]
    image: postgres:16.6
    environment:
      POSTGRES_DB: adhikarai
      POSTGRES_USER: adhikarai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adhikarai_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    profiles: ["offline"]
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
